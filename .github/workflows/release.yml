name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          check-latest: true
      - name: Validate tag and version
        id: tag
        run: python .github/scripts/release.py validate
      - name: Require a commit from main
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
    secrets:
      DEPENDENCIES_TOKEN: ${{ secrets.DEPENDENCIES_TOKEN }}

  build:
    needs: ci
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          check-latest: true
      - uses: ./.github/actions/fetch-dependencies
        with:
          token: ${{ secrets.DEPENDENCIES_TOKEN }}
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --offline -p exiftool-cli --target "$TARGET"
        shell: bash
      - name: Smoke test native binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/exif"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --version
          "$binary" --help
      - name: Package binary and licenses
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python .github/scripts/release.py package --target "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [validate, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          check-latest: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Verify asset set and generate checksums
        run: python .github/scripts/release.py checksums
      - name: Publish complete GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft > release-state.json 2> release-error.log; then
            if ! python -c 'import json; import sys; sys.exit(not json.load(open("release-state.json"))["isDraft"])'; then
              echo "::error::Release already published; refusing to replace its assets."
              exit 1
            fi
          else
            # A failed lookup is not proof of absence; creation fails safely on other errors.
            gh release create "$tag" --verify-tag --draft --title "$tag" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false --prerelease="$PRERELEASE" --latest="$([[ "$PRERELEASE" == false ]] && echo true || echo false)"
