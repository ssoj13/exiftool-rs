[book]
title = "exiftool-rs"
authors = ["exiftool-rs contributors"]
description = "Read and edit metadata with Rust, Python, and the exif CLI"
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/ssoj13/exiftool-rs"
edit-url-template = "https://github.com/ssoj13/exiftool-rs/edit/main/docs/src/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
